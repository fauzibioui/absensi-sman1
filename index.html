<script>
    // GANTI URL DI BAWAH INI DENGAN URL DEPLOY v2 ANDA
    const PROXY_URL = 'https://script.google.com/macros/library/d/1K5cvx7oWlL1ZiEW0tB-nGra7khEv8D1bCjPte8EGyES8pgNES9w4h0jQ/2';

    async function getData(sheetName) {
        try {
            // PERHATIKAN CARA BARU INI:
            // Kita menggunakan src (sumber) dari iframe tersembunyi untuk melewati CORS
            const response = await fetch(`${PROXY_URL}?sheetName=${encodeURIComponent(sheetName)}`);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const result = await response.json();
            return result; // Data dikembalikan dalam bentuk array 2 dimensi

        } catch (error) {
            console.error(`❌ Gagal mengambil data '${sheetName}':`, error.message);
            return null; // Kembalikan null jika gagal
        }
    }

    async function loadApp() {
        console.log("🔄 Memuat data aplikasi...");
        
        // 1. Ambil settings
        const settings = await getData('settings');
        if (settings && settings.length > 0) {
            console.log("✅ Data settings:", settings);
        } else {
            console.warn("⚠️ Sheet 'settings' kosong atau gagal dimuat.");
        }

        // 2. Ambil users (untuk login)
        const users = await getData('users');
        if (users && users.length > 0) {
            console.log("✅ Data users:", users);
            // Di sini logika login Anda diproses
        } else {
            console.warn("⚠️ Sheet 'users' kosong atau gagal dimuat.");
        }

        console.log("✅ Aplikasi siap!");
    }

    // Jalankan saat halaman dimuat
    document.addEventListener('DOMContentLoaded', loadApp);
</script>
