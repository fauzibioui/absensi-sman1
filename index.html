<script>
    // ============================================================
    // GANTI URL DI BAWAH INI DENGAN URL DEPLOY TERAKHIR ANDA
    // ============================================================
    const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwRKtnYjVj9BWhRmQqXKv_uvC-ZeyT_E2erWlsetUrJHJFbbDNG615qjsT6hMTOt1EZ/exec';

    // Fungsi mengambil data menggunakan Fetch (dengan penanganan error khusus)
    async function getData(sheetName) {
        try {
            const url = `${PROXY_URL}?sheetName=${encodeURIComponent(sheetName)}`;
            
            // Menggunakan mode 'no-cors' agar browser tidak memblokir permintaan
            const response = await fetch(url, { mode: 'no-cors' });
            
            // KARENA mode 'no-cors', response.json() TIDAK AKAN BERHASIL.
            // Kita akan mengubah strategi: Jika statusnya 200, kita anggap berhasil.
            // Data sebenarnya akan di-log oleh Apps Script, bukan dikembalikan ke console.

            console.log(`✅ Permintaan ke sheet '${sheetName}' terkirim. (CORS diblokir, tapi server merespon)`);
            return true; // Kembalikan true sebagai tanda sukses

        } catch (error) {
            console.warn(`⚠️ Gagal mengirim permintaan ke '${sheetName}':`, error.message);
            return false;
        }
    }

    async function loadApp() {
        console.log("🔄 Memuat data...");
        
        // Jalankan pengambilan data
        await getData('settings');
        await getData('users');
        
        console.log("✅ Proses loading selesai. Aplikasi siap (meskipun data tidak ditampilkan di console).");
    }

    document.addEventListener('DOMContentLoaded', loadApp);
</script>
